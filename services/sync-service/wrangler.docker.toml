name = "sync_service2"
main = "build/worker/shim.mjs"
compatibility_date = "2025-03-05"

# No [build] section - build is done during Docker image creation

[observability.logs]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

# DEFAULT ENV -- Used in Local Development & Debugging Remote
[[d1_databases]]
binding = "USER_PEER_MAPPING"
migrations_dir = "./database/user-peer-mapping/migrations/"
database_name = "user-peer-mapping"
database_id = "85b0ffef-e625-4b67-8b3b-77f33fd38fd3"

[durable_objects]
bindings = [
  { name = "DOCUMENT_SYNC_SESSION", class_name = "DocumentSyncSession" },
]

[[r2_buckets]]
binding = "DOCUMENT_SNAPSHOT_BUCKET"
bucket_name = "document-snapshot-bucket-dev"

[vars]
INTERNAL_API_SECRET_KEY = "LOCAL_API_KEY"
SPS_URL = "http://search-processing-service:8080"
DSS_URL = "http://document_storage_service:8080"
DSS_INTERNAL_AUTH_KEY = "local"
LEXICAL_SERVICE_URL = "http://lexical-service:8096"
# Browser origins that may call this worker, comma-separated, each as sent in
# `Origin` (scheme://host[:port]). Empty keeps the built-in list in
# src/inbound/cors.rs. The Docker launcher forwards the container's
# ALLOWED_ORIGINS with --var.
ALLOWED_ORIGINS = ""
# Tags exported spans with deployment.environment=local, matching the
# Datadog agent's DD_ENV so the env:local trace/log views include them.
ENVIRONMENT = "local"
# Disabled by default. The Docker launcher forwards the resolved run setting
# with --var; an empty endpoint disables the custom trace/log exporter.
OTEL_EXPORTER_OTLP_ENDPOINT = ""

[[kv_namespaces]]
binding = "DOCUMENT_VERSIONING_KV"
id = "3548ca6265c745e38cd504194aa6e887"

[[kv_namespaces]]
binding = "SNAPSHOT_STORE_KV"
id = "9beead2b7891492f82153d2354e64e92"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DocumentSyncSession"]
