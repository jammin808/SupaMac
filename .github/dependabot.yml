version: 2
# GitHub Actions are pinned in tooling/xtask/crates/xtask_workflows/actions.lock
# and written into generated workflows, so they are moved there by hand
# (docs/supamac/delivery.md); a bump to a generated file fails the drift check.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directories:
      - /
      - /infra
      - /services/sync-service
      - /services/websocket-service
      - /services/analytics-proxy
      - /services/cla-worker
      - /services/convert_service/helpers
      - /apps/docs
      - /agent-teammates/muppet
      - /agent-teammates/starter-agent
      - /packages/starter-agent
      - /infra/stacks/opensearch/helpers
      - /nix/macro-box/claude-agent-acp
      - /tooling/scripts/migrate-s3-keys-extensionless
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
