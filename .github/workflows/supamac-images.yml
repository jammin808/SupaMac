    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
      env:
        GIT_HTTP_LOW_SPEED_LIMIT: '10000'
        GIT_HTTP_LOW_SPEED_TIME: '60'
    - name: Free disk space
      run: |
        df --human-readable --output=avail / | tail -n 1
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        df --human-readable --output=avail / | tail -n 1
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Build supamac-ops
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: infra/self-hosted/ops/Dockerfile
        platforms: linux/amd64
        push: 'false'
    - name: Build supamac-search
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: infra/local/opensearch
        file: infra/local/opensearch/Dockerfile
        platforms: linux/amd64
        push: 'false'
  ops-image:
    if: github.event_name != 'pull_request'
    name: Publish the ops and search images
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
      env:
        GIT_HTTP_LOW_SPEED_LIMIT: '10000'
        GIT_HTTP_LOW_SPEED_TIME: '60'
    - name: Free disk space
      run: |
        df --human-readable --output=avail / | tail -n 1
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        df --human-readable --output=avail / | tail -n 1
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Name the registry namespace
      run: echo "IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
    - name: Log in to the container registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: build-supamac-ops
      name: Build and push supamac-ops
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: infra/self-hosted/ops/Dockerfile
        platforms: linux/amd64
        push: 'true'
        tags: |
          ${{ env.IMAGE_NAMESPACE }}/supamac-ops:${{ github.sha }}
          ${{ github.ref == 'refs/heads/main' && format('{0}/supamac-ops:latest', env.IMAGE_NAMESPACE) || '' }}
        labels: |
          org.opencontainers.image.title=supamac-ops
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.licenses=AGPL-3.0-only
        provenance: mode=max
        sbom: 'true'
    - name: Attest the provenance of supamac-ops
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-name: ${{ env.IMAGE_NAMESPACE }}/supamac-ops
        subject-digest: ${{ steps.build-supamac-ops.outputs.digest }}
        push-to-registry: 'true'
        create-storage-record: 'false'
    - name: Report the digest of supamac-ops
      run: |
        set -euo pipefail

        # The digest names exactly what this run pushed. A deployment pins it.
        test -n "$DIGEST"
        {
          echo "### $IMAGE"
          echo
          echo '```'
          echo "$IMAGE@$DIGEST"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
      env:
        IMAGE: ${{ env.IMAGE_NAMESPACE }}/supamac-ops
        DIGEST: ${{ steps.build-supamac-ops.outputs.digest }}
    - id: build-supamac-search
      name: Build and push supamac-search
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: infra/local/opensearch
        file: infra/local/opensearch/Dockerfile
        platforms: linux/amd64
        push: 'true'
        tags: |
          ${{ env.IMAGE_NAMESPACE }}/supamac-search:${{ github.sha }}
          ${{ github.ref == 'refs/heads/main' && format('{0}/supamac-search:latest', env.IMAGE_NAMESPACE) || '' }}
        labels: |
          org.opencontainers.image.title=supamac-search
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.licenses=Apache-2.0
        provenance: mode=max
        sbom: 'true'
    - name: Attest the provenance of supamac-search
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-name: ${{ env.IMAGE_NAMESPACE }}/supamac-search
        subject-digest: ${{ steps.build-supamac-search.outputs.digest }}
        push-to-registry: 'true'
        create-storage-record: 'false'
    - name: Report the digest of supamac-search
      run: |
        set -euo pipefail

        # The digest names exactly what this run pushed. A deployment pins it.
        test -n "$DIGEST"
        {
          echo "### $IMAGE"
          echo
          echo '```'
          echo "$IMAGE@$DIGEST"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
      env:
        IMAGE: ${{ env.IMAGE_NAMESPACE }}/supamac-search
        DIGEST: ${{ steps.build-supamac-search.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
concurrency:
  group: supamac-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
