permissions:
  contents: read
jobs:
  services:
    name: Build the service binaries
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
      SQLX_OFFLINE: 'true'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    timeout-minutes: 350
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
      env:
        GIT_HTTP_LOW_SPEED_LIMIT: '10000'
        GIT_HTTP_LOW_SPEED_TIME: '60'
    - name: Free disk space
      run: |
        df --human-readable --output=avail / | tail -n 1
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        df --human-readable --output=avail / | tail -n 1
    - name: Install build packages
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends build-essential cmake libcurl4-openssl-dev libsasl2-dev perl pkg-config
    - name: Install pinned Rust tooling
      run: rustup toolchain install 1.94.0 --profile minimal
    - name: Setup Bun for current lockfile formats
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.4.5
    - name: Generate the code-mode assets
      run: |
        bun install --frozen-lockfile --ignore-scripts
        bun packages/code-mode-sdk/scripts/generate.ts "$RUNNER_TEMP/code-mode-assets"
        echo "CODE_MODE_ASSETS_DIR=$RUNNER_TEMP/code-mode-assets" >> "$GITHUB_ENV"
        find . -name node_modules -type d -prune -exec rm -rf {} +
    - id: cargo-cache
      name: Restore the cargo cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git
          target/release
        key: supamac-services-${{ runner.os }}-rust1.94.0-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          supamac-services-${{ runner.os }}-rust1.94.0-${{ hashFiles('Cargo.lock') }}-
          supamac-services-${{ runner.os }}-rust1.94.0-
    - id: build
      name: Build every service in one cargo invocation
      run: |
        cargo build --release --locked \
          -p authentication_service --bin authentication_service \
          -p document_storage_service --bin document_storage_service \
          -p connection_gateway --bin connection_gateway_service \
          -p notification_service --bin notification_service \
          -p static_file_service --bin static_file_service \
          -p document_upload_finalizer_handler --bin document_upload_finalizer_local_worker \
          -p contacts_service --bin contacts_service \
          -p email_service --bin email_service --bin pubsub_workers \
          -p email_refresh_handler --bin email_refresh_handler \
          -p email_scheduled_handler --bin email_scheduled_handler \
          -p calendar_service --bin calendar_service \
          -p agent_harness_service --bin agent_harness_service \
          -p search_processing_service --bin search_processing_service \
          -p unfurl_service --bin unfurl_service \
          -p image_proxy_service --bin image_proxy_service
      timeout-minutes: 300
    - name: Strip the binaries into the image context
      run: |
        set -euo pipefail

        # The image's build context: the binaries and the one library a service loads
        # at run time. Nothing else from the checkout enters the image.
        mkdir -p "$CONTEXT/bin" "$CONTEXT/pdfium-lib/linux"

        for binary in $BINARIES; do
          strip -o "$CONTEXT/bin/$binary" "target/release/$binary"
        done

        # search_processing_service opens this library when it parses a PDF. The
        # repository tracks it, and the digest is the tracked file's, so a library
        # that changed is noticed here and not in a running service.
        pdfium=services/search_processing_service/pdfium-lib/linux/libpdfium.so
        printf '%s  %s\n' "$PDFIUM_SHA256" "$pdfium" | sha256sum --check
        cp "$pdfium" "$CONTEXT/pdfium-lib/linux/libpdfium.so"

        ls -l "$CONTEXT/bin"
        du --summarize --human-readable "$CONTEXT"
      env:
        BINARIES: authentication_service document_storage_service connection_gateway_service notification_service static_file_service document_upload_finalizer_local_worker contacts_service email_service pubsub_workers email_refresh_handler email_scheduled_handler calendar_service agent_harness_service search_processing_service unfurl_service image_proxy_service
        CONTEXT: ${{ runner.temp }}/services-context
        PDFIUM_SHA256: 3f3af4e4ba46bec9d0d11c5635262663b7020345ff4bed7eee85e883e2ce8455
    - name: Drop the linked binaries from the cargo cache
      if: '!cancelled() && github.ref == ''refs/heads/main'' && github.event_name != ''pull_request'' && steps.cargo-cache.outputs.cache-hit != ''true'' && steps.build.outcome != ''skipped'''
      run: |
        set -euo pipefail

        # A build that stopped before it compiled anything left nothing to trim.
        test -d target/release/deps || exit 0

        # A fresh checkout's sources are newer than any kept build, so cargo
        # recompiles the workspace's own crates and links every binary again on each
        # run: only third-party crates are reused. The linked executables are the
        # largest files no later run reads, so they are not kept.
        find target/release -maxdepth 1 -type f -executable -delete
        find target/release/deps -maxdepth 1 -type f -executable ! -name '*.so' -delete
        du --summarize --human-readable target/release
    - name: Save the cargo cache
      if: '!cancelled() && github.ref == ''refs/heads/main'' && github.event_name != ''pull_request'' && steps.cargo-cache.outputs.cache-hit != ''true'' && steps.build.outcome != ''skipped'''
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git
          target/release
        key: ${{ steps.cargo-cache.outputs.cache-primary-key }}${{ steps.build.outcome != 'success' && format('-partial-{0}-{1}', github.run_id, github.run_attempt) || '' }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Build the services image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: ${{ runner.temp }}/services-context
        file: infra/self-hosted/images/services.Dockerfile
        platforms: linux/amd64
        load: 'true'
        tags: supamac-services:check
    - name: Check the image runs what was built
      run: |
        set -euo pipefail

        # Runs inside the image as its own user, with no network. The binaries were
        # linked on the runner, so this is where a shared library the image lacks, or
        # a C library older than the runner's, shows up.
        docker run --rm --interactive --network none --entrypoint sh "$IMAGE" -eu -s -- $BINARIES <<'CHECK'
        test "$(id -u)" = 10001

        for binary in "$@"; do
          test -x "/app/bin/$binary"
          if ldd "/app/bin/$binary" 2>&1 | grep 'not found'; then
            echo "$binary needs a shared library this image does not have" >&2
            exit 1
          fi
        done

        pdfium=/app/pdfium-lib/linux/libpdfium.so
        test -r "$pdfium"
        if ldd "$pdfium" 2>&1 | grep 'not found'; then
          echo "libpdfium.so needs a shared library this image does not have" >&2
          exit 1
        fi

        "$DENO_BINARY" --version
        test -x "$(git --exec-path)/git-http-backend"
        test -w /data/agent-git
        echo "the image holds $# binaries and what they load"
        CHECK
      env:
        BINARIES: authentication_service document_storage_service connection_gateway_service notification_service static_file_service document_upload_finalizer_local_worker contacts_service email_service pubsub_workers email_refresh_handler email_scheduled_handler calendar_service agent_harness_service search_processing_service unfurl_service image_proxy_service
        IMAGE: supamac-services:check
    - name: Pack the image context
      if: github.event_name != 'pull_request'
      run: tar --create --zstd --file "$ARCHIVE" --directory "$CONTEXT" .
      env:
        ARCHIVE: ${{ runner.temp }}/services-context.tar.zst
        CONTEXT: ${{ runner.temp }}/services-context
    - name: Hand the image context to the publishing job
