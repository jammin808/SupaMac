name: SupaMac images
on:
  pull_request:
    branches:
    - main
    paths:
    - .cargo/**
    - .dockerignore
    - .sqlx/**
    - Cargo.lock
    - Cargo.toml
    - rust-toolchain.toml
    - bun.lock
    - bunfig.toml
    - package.json
    - apps/web/patches/**
    - crates/**
    - packages/**
    - services/**
    - vendor/**
    - docker/sync-service.Dockerfile
    - infra/self-hosted/**
    - infra/local/opensearch/**
    - infra/stacks/opensearch/helpers/**
    - infra/stacks/fusionauth-instance/templates/populate_jwt_local.js
    - .github/kafka-cluster-topics.json
    - tooling/xtask/crates/xtask_workflows/src/workflows/fork_steps.rs
    - tooling/xtask/crates/xtask_workflows/src/workflows/supamac_images.rs
    - tooling/xtask/crates/xtask_workflows/src/workflows/supamac_images/**
    - .github/workflows/supamac-images.yml
