# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/deploy_on_push.rs
name: Deploy on Push
on:
  push:
    branches:
    - main
jobs:
  deploy-cloud-storage:
    name: Deploy Cloud Storage Services
    uses: ./.github/workflows/deploy_all_services.yml
    with:
      environment: dev
    secrets:
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
    if: github.repository == 'macro-inc/macro'
  deploy-sync-service:
    needs:
    - deploy-cloud-storage
    name: Deploy Sync Service
    uses: ./.github/workflows/deploy_sync_service.yml
    with:
      environment: dev
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    if: github.repository == 'macro-inc/macro'
  deploy-mcp-chatgpt-worker:
    needs:
    - deploy-cloud-storage
    name: Deploy MCP ChatGPT Worker
    uses: ./.github/workflows/deploy_mcp_chatgpt_worker.yml
    with:
      environment: dev
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    if: github.repository == 'macro-inc/macro'
  build-web-app:
    name: Build Web App
    uses: ./.github/workflows/build_web_app.yml
    with:
      environment: dev
    secrets:
      SEGMENT_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_KEY_PRODUCTION }}
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
    if: github.repository == 'macro-inc/macro'
  deploy-web-app:
    needs:
    - deploy-cloud-storage
    - deploy-sync-service
    - build-web-app
    name: Deploy Web App
    uses: ./.github/workflows/deploy_web_app.yml
    with:
      notify: false
      environment: dev
      prebuilt: true
    secrets:
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      SEGMENT_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_KEY_PRODUCTION }}
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
    if: github.repository == 'macro-inc/macro'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
