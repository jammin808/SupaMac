// The queue service behind the in-network AWS endpoint.
//
// Every queue of the local stack's catalogue
// (tooling/xtask/crates/xtask_local/src/local/resources.rs) is declared here
// with the attributes that catalogue gives it, so the services never see a
// missing queue: a worker whose queue is absent retries in a tight loop. Two
// queues also get what their deployed counterparts have and their workers
// count on, which the catalogue leaves out: see the notes on them below.
//
// This file creates queues; it does not change them. A queue that is already
// in the database under /data keeps the attributes it has there, whatever
// this file says. ops/scripts/init-aws.sh holds the same list and sets the
// attributes on every deployment; a test holds the two lists to each other.
include classpath("application.conf")

// Queue URLs are built from this address. The services reach every AWS API
// through the router at localstack:4566, never this container directly.
node-address {
  protocol = http
  host = localstack
  port = 4566
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = false
}

generate-node-address = false

// The account id is part of every queue URL the services are configured with.
aws {
  region = us-east-1
  accountId = "000000000000"
}

// Queues and their messages are kept in a database under /data, the data
// volume, so a restart loses neither.
messages-storage {
  enabled = true
}

queues {
  slack-import-queue {
    defaultVisibilityTimeout = 900 seconds
    deadLettersQueue {
      name = "slack-import-dlq"
      maxReceiveCount = 5
    }
  }
  slack-import-dlq {}
  notification-queue {}
  notification-ingress-queue {}
  push-delivery-queue {}
  "webhook-event-queue.fifo" {
    fifo = true
  }
  email-service-backfill-queue {}
  email-service-crm-cleanup-queue {}
  // No service sends to or reads this queue yet: upstream creates it one
  // release ahead of its consumer.
  "email-service-crm-population-queue.fifo" {
    fifo = true
    defaultVisibilityTimeout = 60 seconds
    delay = 10 seconds
  }
  delete-chat-handler-queue {}
  // The contacts worker leaves a message it cannot read, or must refuse, on
  // the queue for a dead-letter queue to take after five receives, as the
  // deployed queue does. Without one such a message is redelivered for ever.
  contacts-queue {
    deadLettersQueue {
      name = "contacts-dlq"
      maxReceiveCount = 5
    }
  }
  contacts-dlq {}
  convert-service-queue {}
  delete-document-handler-queue {}
  document-upload-finalizer-queue {}
  document-text-extractor-lambda-queue {}
  email-service-scheduled-queue {}
  email-service-gmail-inbox-sync-queue {}
  email-service-gmail-inbox-retry-queue {}
  email-service-gmail-ops-queue {}
  email-service-gmail-ops-retry-queue {}
  // The two lanes of the email link manager. A mailbox purge renews its
  // message's visibility after 60 seconds, so the default of 30 would hand
  // the purge to a second worker first.
  email-service-refresh-queue {
    defaultVisibilityTimeout = 300 seconds
  }
  email-service-link-maintenance-queue {
    defaultVisibilityTimeout = 300 seconds
  }
  // The search workers extend a running message's visibility every 30
  // seconds and count on the deployed queue's 120: at the default of 30 a
  // message becomes visible as its first extension falls due. A replay that
  // fails twice goes to the dead-letter queue, as deployed.
  search-event-queue {
    defaultVisibilityTimeout = 120 seconds
    deadLettersQueue {
      name = "search-event-queue-dlq"
      maxReceiveCount = 2
    }
  }
  search-event-queue-dlq {}
  email-sfs-delete-queue {}
  email-service-sfs-mapper-queue {}
  static-file-s3-event-notification-queue {}
  reminder-dispatch-queue {}
  calendar-reminder-dispatch-queue {}
  calendar-service-backfill-queue {}
}
